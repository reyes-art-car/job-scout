# nginx delante de la API y del frontend. Es la PRIMERA barrera: descarta el exceso de peticiones con muy
# poco coste antes de que lleguen a Python (el límite de la aplicación es la segunda).
#
# Termina TLS un proxy externo (Caddy, Traefik, Cloudflare o nginx con certificados): añade allí
# `Strict-Transport-Security`. Este fichero no habla HTTPS por sí mismo.

limit_req_zone  $binary_remote_addr zone=jh_web:10m  rate=50r/s;
limit_req_zone  $binary_remote_addr zone=jh_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=jh_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=jh_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# Cierra rápido las conexiones lentas (slowloris).
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          15s;
reset_timedout_connection on;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;          # igual que MAX_BODY_BYTES de la API
    limit_conn jh_conn 40;
    limit_req  zone=jh_web burst=100 nodelay;

    # Cabeceras de seguridad (`always` también en respuestas de error).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # frame-ancestors solo funciona como cabecera (no en <meta>), por eso se repite aquí la CSP del index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Registro e inicio de sesión: la barrera más estricta, para frenar la fuerza bruta de contraseñas y el
    # alta masiva de cuentas antes de que lleguen a Python (cada intento cuesta CPU por el hash).
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=jh_auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_hide_header Server;
    }

    location /api/ {
        limit_req zone=jh_api burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Se SUSTITUYE (no se añade) la cabecera: así un cliente no puede falsear su IP ante el limitador.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # Las respuestas de la API contienen datos personales: ni caché de proxy ni del navegador.
        proxy_hide_header Server;
    }

    # Los ficheros con hash en el nombre son inmutables; el index no se cachea.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header en un location anula las del server: se repiten las imprescindibles.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # Nunca servir ficheros ocultos.
    location ~ /\. { deny all; }
}
