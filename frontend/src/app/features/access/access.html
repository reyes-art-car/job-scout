<main class="gate" id="main-content">
  <form class="card" (submit)="submit($event, email.value, password.value)">
    <h1>{{ mode() === 'login' ? 'Iniciar sesión' : 'Crear cuenta' }}</h1>
    <p class="muted">
      {{ mode() === 'login' ? 'Entra para ver tus ofertas y lanzar búsquedas.' : 'Crea tu cuenta para guardar tu perfil y buscar ofertas a tu medida.' }}
    </p>
    <label>
      Email
      <input #email type="email" autocomplete="email" maxlength="254" required />
    </label>
    <label>
      Contraseña
      <input
        #password
        type="password"
        [autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
        [attr.minlength]="mode() === 'register' ? minPassword : null"
        maxlength="128"
        required
        [attr.aria-invalid]="error() ? 'true' : null"
        aria-describedby="access-error"
      />
    </label>
    <p id="access-error" class="error" role="alert">{{ error() }}</p>
    <button class="btn primary" type="submit" [disabled]="busy()">
      {{ busy() ? 'Un momento…' : mode() === 'login' ? 'Entrar' : 'Crear cuenta' }}
    </button>
    @if (mode() === 'login') {
      <button class="link" type="button" (click)="switchTo('register')">No tengo cuenta · Crear una</button>
    } @else {
      <button class="link" type="button" (click)="switchTo('login')">Ya tengo cuenta · Iniciar sesión</button>
    }
    <a class="link" routerLink="/">Volver al inicio</a>
  </form>
</main>
