[build]
  base = "frontend"
  command = "npm ci && npx ng build"
  # Relative to the base directory above.
  publish = "dist/job-hunter/browser"
  # Edge Function que pide contraseña antes de servir el sitio (relative to base). Ver docs/SECURITY.md.
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

# Fallback de SPA: las rutas de Angular (/ofertas, /carta...) se resuelven en el cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
