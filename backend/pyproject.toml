[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y pyflakes · I: orden de imports · B: bugs probables · UP: sintaxis moderna
# S: seguridad (bandit) · SIM/C4/RUF: simplificaciones · PT: buenas prácticas de pytest · N: nombres
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF", "PT", "N", "A", "ARG", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query en valores por defecto es el patrón de FastAPI, no un error.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "PLR0915", "SLF001", "S311", "E501", "PLC0415", "PT018"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]
