version: 2

# Keep routine updates together and review major upgrades separately.
# Security updates have their own group and are not delayed by the monthly schedule.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      backend-major-upgrades:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /automation
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      automation-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      automation-major-upgrades:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      automation-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-major-upgrades:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major-upgrades:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docker-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major-upgrades:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
